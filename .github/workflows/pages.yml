name: Deploy roadmap site to GitHub Pages

on:
  push:
    branches: [main]
    # ロードマップ項目そのものが出典なので、roadmaps/ の変更でも公開し直す
    paths:
      - 'roadmaps/**'
      - 'tools/build_roadmap_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは打ち切らない（公開中のサイトが中途半端な状態になるのを避ける）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 最終更新日は roadmaps/ に最後に触れたコミットから取る。浅いクローンだと
          # そのコミットが履歴に無く、日付が実際より新しく出てしまう。
          fetch-depth: 0

      # 公開するのは常にビルドし直したもの。コミット済みの site/ が古くても、
      # 公開されるページは roadmaps/ と一致する。
      - run: python3 tools/build_roadmap_site.py

      # 事前にリポジトリ設定 → Pages → Build and deployment → Source を
      # "GitHub Actions" にしておく必要がある。GITHUB_TOKEN では Pages サイトを
      # 作成できず（Resource not accessible by integration）、enablement: true でも
      # 代替できないため、この一手だけは人が行う。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
