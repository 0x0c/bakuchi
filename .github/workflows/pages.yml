name: Deploy roadmap site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは打ち切らない（公開中のサイトが中途半端な状態になるのを避ける）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 事前にリポジトリ設定 → Pages → Build and deployment → Source を
      # "GitHub Actions" にしておく必要がある。GITHUB_TOKEN では Pages サイトを
      # 作成できず（Resource not accessible by integration）、enablement: true でも
      # 代替できないため、この一手だけは人が行う。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
